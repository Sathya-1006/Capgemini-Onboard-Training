<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Add Product</title>
</head>

<body>

<h2>Add Product</h2>

<form action="/save" method="post" th:object="${product}">

ID :
<input type="number" th:field="*{id}">

<br><br>

Name :
<input type="text" th:field="*{name}">

<br><br>

Price :
<input type="number" step="0.01" th:field="*{price}">

<br><br>

Manufacture Date :
<input type="date" th:field="*{mfgDt}">

<br><br>

<input type="submit" value="Save">

</form>

</body>
</html>
